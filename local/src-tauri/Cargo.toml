[package]
name = "splitlens"
version = "0.1.0"
description = "Local-first expense tracker for personal and shared spending"
authors = ["SplitLens"]
edition = "2021"

[lib]
name = "splitlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
